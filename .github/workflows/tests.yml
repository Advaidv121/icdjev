name: tests
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra jev --extra documents --extra dev
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check src tests examples
      - run: uv run --no-sync ruff format --check src tests examples
      - run: uv build
      - run: |
          uv venv /tmp/core-check
          uv pip install --python /tmp/core-check/bin/python dist/*.whl
          cd /tmp
          /tmp/core-check/bin/python -c 'from icdjev import Catalogue, ICDLookup; import importlib.util; assert importlib.util.find_spec("typesafe_sdk") is None'
